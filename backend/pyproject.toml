[project]
name = "suscriptor-incendio"
version = "0.1.0"
description = "Copiloto de suscripción de seguros de incendio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "Pillow>=10.0",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "weasyprint>=62.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["N818", "UP042", "UP046", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "app.dominio.*"
disallow_untyped_defs = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eval: evals con LLM real (costosas, requieren confirmación)",
]
